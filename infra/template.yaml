AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LPL Delegation Assistant - Lambda Function URL (Mock Gate) that fetches
  mock client data, drafts documents via Amazon Bedrock (Claude 3.5 Sonnet),
  and tracks PENDING_APPROVAL / APPROVED request state.

Parameters:
  ProjectName:
    Type: String
    Default: lpl-delegation-assistant
    Description: Project name for resource naming
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-5-sonnet-20241022-v2:0
    Description: Bedrock model ID used to generate drafts

Resources:
  DelegationGateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-gate'
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      CodeUri: ../
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_MOCK_MODE: "false"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: '*'
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ['*']
          AllowMethods: ['GET', 'POST']
          AllowHeaders: ['content-type']

Outputs:
  FunctionUrl:
    Description: Lambda Function URL for the delegation mock gate (set as BACKEND_URL for the frontend)
    Value: !GetAtt DelegationGateFunctionUrl.FunctionUrl
  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt DelegationGateFunction.Arn
